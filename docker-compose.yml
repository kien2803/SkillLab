# Local development — `docker compose up` builds the prod image and
# serves API + built SPA on :8320. Frontend sources are NOT mounted:
# production serves the compiled bundle, not the vite dev server.
services:
  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    ports: ["8320:8320"]
    environment:
      SKILLLAB_DIR: /lab
      SKILLLAB_ENV: production
      SKILLLAB_TOKEN: ${SKILLLAB_TOKEN:?set SKILLLAB_TOKEN}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SKILLLAB_CORS_ORIGINS: ${SKILLLAB_CORS_ORIGINS:-}
    volumes:
      - lab-data:/lab
    restart: unless-stopped
volumes:
  lab-data:
