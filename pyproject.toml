[project]
name = "skilllab"
version = "0.1.0"
description = "Skill Lab — an experiment-first environment for researching and crafting AI agent skills"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.40.0"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # UploadFile/form parsing
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",               # fastapi TestClient
    "playwright>=1.44",
]

[project.scripts]
lab = "skilllab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skilllab*"]
